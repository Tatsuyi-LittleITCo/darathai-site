name: Deploy React + Vite Site

on:
  push:
    branches:
      - main        # live site
      - develop     # staging site

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js 20+
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build Vite project
      - name: Build React + Vite
        run: npm run build

      # 5. Deploy via SFTP
      - name: Deploy to cPanel via SFTP
        uses: appleboy/scp-action@master
        with:
          host: ftp.darathaidancing.com.au
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "dist/*"
          target: ${{ github.ref == 'refs/heads/main' && '/public_html/' || '/public_html/staging/' }}
